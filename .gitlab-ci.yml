image: node:22

stages: [build, test]

variables:
  GIT_DEPTH: "20"

build:
  stage: build
  script:
    - npm ci --cache .npm --prefer-offline
    - npx vue-tsc --noEmit
    - npm run build
  artifacts:
    paths: [dist/]
    expire_in: 1 week

docs:
  stage: test
  script:
    - apt-get update && apt-get install -y python3
    - python3 tools/check-docs.py
