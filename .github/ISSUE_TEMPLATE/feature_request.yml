name: 功能建议
description: 想要新的页面、配置项或更顺手的操作
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前可以先翻翻已有的 Issue，并确认
        [docs/FEATURES.md](https://github.com/MVennn/OpenwrtConsole/blob/main/docs/FEATURES.md)
        与 [docs/LIMITS.md](https://github.com/MVennn/OpenwrtConsole/blob/main/docs/LIMITS.md)
        里没有现成能力或明确不做的事项。

  - type: textarea
    id: scenario
    attributes:
      label: 什么场景不顺手
      description: |
        先说场景再说想法——「在哪个页面、现在要几步、哪一步容易出错或看不到」。
      placeholder: |
        例：
        想同时看多个接口的实时流量，现在要来回切换页面，
        希望概览页能固定展示其中两个。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的效果（可选）
      description: 希望新增页面、扩展现有页面，还是只补说明？有草图或参考更好
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这个建议要在控制台内完成，危险动作仍保留一次性令牌与确认词，不通过降低安全门槛来换方便。
          required: true
        - label: 我知悉控制台不对外网暴露，也不打算通过本建议把 `/modern/` 开放到 WAN。
          required: true
        - label: 我知悉改动需要在真机或 mock 环境验证，愿意配合验证。
          required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息（可选）
      description: 相关页面截图、LuCI 里的对应做法、设备型号等
    validations:
      required: false
